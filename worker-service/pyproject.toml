[project]
name = "worker-service"
version = "0.1.0"
description = "Task scheduler worker for Cloud Run"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.0",
    "requests==2.31.0",
    "gunicorn==21.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"